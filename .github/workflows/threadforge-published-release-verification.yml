name: Threadforge published-release verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without the leading v
        required: true
        type: string

permissions:
  contents: read
  attestations: read
  actions: read

concurrency:
  group: threadforge-published-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      attestations: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Resolve and validate release identity
        id: resolve
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$EVENT_TAG" ]]; then
            tag="$EVENT_TAG"
          else
            if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "workflow_dispatch requires a stable MAJOR.MINOR.PATCH version" >&2
              exit 1
            fi
            tag="v$INPUT_VERSION"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag is not a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          version="${tag#v}"
          source_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha')"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GitHub returned an invalid tag commit" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Download the exact tag candidate bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ steps.resolve.outputs.source_commit }}
        run: |
          set -euo pipefail
          candidate_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow threadforge-tests.yml \
            --commit "$SOURCE_COMMIT" \
            --event push \
            --limit 100 \
            --json databaseId,headSha,headBranch,event,status,conclusion,createdAt)"
          candidate_run_id="$(jq -r \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$SOURCE_COMMIT" \
            'map(select(.headBranch == $tag and .headSha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")) | sort_by(.createdAt) | last | .databaseId // ""' \
            <<< "$candidate_runs")"
          if [[ ! "$candidate_run_id" =~ ^[0-9]+$ ]]; then
            echo "No successful candidate workflow run exists for the exact release tag and commit." >&2
            exit 1
          fi
          candidate_dir="$RUNNER_TEMP/threadforge-release-candidate"
          mkdir "$candidate_dir"
          gh run download "$candidate_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --name "threadforge-release-candidate-$RELEASE_VERSION" \
            --dir "$candidate_dir"

      - name: Verify published assets against candidate provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ steps.resolve.outputs.source_commit }}
          CANDIDATE_DIR: ${{ runner.temp }}/threadforge-release-candidate
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/threadforge-published-release-verification.json"
          python scripts/verify_published_release.py \
            --bundle-dir "$CANDIDATE_DIR" \
            --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --repo "$GITHUB_REPOSITORY" > "$report"
          {
            echo "# Published release verification: $RELEASE_TAG"
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
