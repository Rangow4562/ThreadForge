name: Threadforge test gates

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Stable version for a non-tag release-pipeline rehearsal from main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: threadforge-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Required suites (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    steps:
      - name: Check out Threadforge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up locked Python environment
        shell: bash
        working-directory: python
        run: |
          python -m pip install uv==0.11.7
          uv --version
          uv lock --check
          uv sync --locked --extra test --extra decisions --extra workspace

      - name: Validate vLLM serving extra platform selection
        if: runner.os == 'Linux' && matrix.python == '3.11'
        shell: bash
        working-directory: python
        run: |
          uv sync --quiet --locked --dry-run --python 3.11 --python-platform linux --extra serving
          uv sync --quiet --locked --dry-run --python 3.11 --python-platform windows --extra serving
          uv sync --quiet --locked --dry-run --python 3.11 --python-platform macos --extra serving

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: adapters/package-lock.json

      - name: Use a canonical temporary directory for strict filesystem tests
        if: runner.os == 'macOS'
        shell: bash
        run: |
          temp_root="$(cd "$RUNNER_TEMP" && pwd -P)/threadforge-tmp"
          mkdir -p "$temp_root"
          chmod 700 "$temp_root"
          if [ -L "$temp_root" ]; then
            echo "Threadforge temporary directory must not be a symlink" >&2
            exit 1
          fi
          printf 'TMPDIR=%s\n' "$temp_root" >> "$GITHUB_ENV"

      - name: Run Threadforge Go tests and vet
        shell: bash
        run: |
          uv run --project python --locked --extra test --extra decisions --extra workspace go test ./...
          uv run --project python --locked --extra test --extra decisions --extra workspace go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Run vendored Beacon contract tests
        shell: bash
        working-directory: third_party/agent-beacon/pkg/asymptoteobserve
        run: go test ./...

      - name: Test the Linux user-local release installer
        if: runner.os == 'Linux'
        shell: bash
        run: bash packaging/linux/test-install.sh

      - name: Test the Windows user-local release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-install.ps1

      - name: Run Python tests, compile check, and lint
        shell: bash
        working-directory: python
        env:
          THREADFORGE_REQUIRE_ENGINEERING_GATEWAY_HTTP: "1"
        run: |
          uv run --locked --extra test --extra decisions --extra workspace python -m pytest -q
          uv run --locked --extra test --extra decisions --extra workspace python -m compileall -q threadforge_py threadforge_domains anyjev rrsi scripts tests setup.py ../third_party/harbor_terminus2 ../third_party/archipelago ../domains/coding ../domains/workspace
          uv run --locked --extra test --extra decisions --extra workspace ruff check threadforge_py tests

      - name: Build, inspect, and install Python distributions
        shell: bash
        working-directory: python
        run: uv run --locked --extra test --extra decisions --extra workspace python scripts/verify_distribution.py

      - name: Install TypeScript adapter dependencies
        shell: bash
        working-directory: adapters
        run: npm ci

      - name: Audit TypeScript adapter dependencies
        shell: bash
        working-directory: adapters
        run: npm audit --audit-level=moderate

      - name: Run TypeScript adapter typecheck and tests
        shell: bash
        working-directory: adapters
        run: |
          npm run check
          npm test

      - name: Verify TypeScript adapter package contents
        shell: bash
        working-directory: adapters
        run: npm run test:package

      - name: Install browser extension dependencies
        shell: bash
        working-directory: adapters/browser-extension
        run: npm ci

      - name: Audit browser extension dependencies
        shell: bash
        working-directory: adapters/browser-extension
        run: npm audit --audit-level=moderate

      - name: Install Playwright Chromium and Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        working-directory: adapters/browser-extension
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        shell: bash
        working-directory: adapters/browser-extension
        run: npx playwright install chromium

      - name: Check, build, and run browser extension replay tests
        shell: bash
        working-directory: adapters/browser-extension
        run: |
          npm run check
          npm run test:unit
          npm run build
          npx playwright test --reporter=line --output "$RUNNER_TEMP/threadforge-browser-playwright"

      - name: Lint and package browser extension builds
        shell: bash
        working-directory: adapters/browser-extension
        run: |
          npm run lint:firefox
          npm run package:chromium
          npm run package:firefox

  elasticsearch-local-stack:
    name: Elasticsearch synthetic ingestion (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out Threadforge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Threadforge CLI
        shell: bash
        run: go build -o "$RUNNER_TEMP/threadforge" ./cmd/threadforge

      - name: Start ephemeral stack and verify synthetic ingestion
        shell: bash
        run: bash scripts/test-elasticsearch-stack.sh "$RUNNER_TEMP/threadforge" "$RUNNER_TEMP/threadforge-elasticsearch-pack"

  python-license-evidence:
    name: Python license evidence (${{ matrix.target_os }}, Python ${{ matrix.python }})
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
      || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [test, elasticsearch-local-stack]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target_os: linux
            python: '3.11'
          - runner: ubuntu-latest
            target_os: linux
            python: '3.12'
          - runner: windows-latest
            target_os: windows
            python: '3.11'
          - runner: windows-latest
            target_os: windows
            python: '3.12'
          - runner: macos-latest
            target_os: darwin
            python: '3.11'
          - runner: macos-latest
            target_os: darwin
            python: '3.12'
    steps:
      - name: Check out Threadforge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and source commit
        id: release
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release candidate tags must be stable vMAJOR.MINOR.PATCH tags." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            if [[ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "The tag does not resolve to the workflow source commit." >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" == main ]]; then
            version="$RELEASE_VERSION_INPUT"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Manual release rehearsals require a stable MAJOR.MINOR.PATCH version." >&2
              exit 1
            fi
          else
            echo "Release candidates require a stable tag or a manual dispatch from main." >&2
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release source must be reachable from origin/main." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up locked Python evidence environment
        shell: bash
        working-directory: python
        run: |
          python -m pip install uv==0.11.7
          uv --version
          uv lock --check
          uv sync --locked --extra test --extra decisions --extra workspace

      - name: Collect locked Python license and notice evidence
        shell: bash
        working-directory: python
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.source_date_epoch }}
          TARGET_OS: ${{ matrix.target_os }}
          PYTHON_VERSION: ${{ matrix.python }}
          LICENSE_EVIDENCE_PATH: dist/threadforge_${{ steps.release.outputs.version }}_python_${{ matrix.target_os }}_py${{ matrix.python }}.license-evidence.tar.gz
        run: >-
          mkdir -p dist &&
          uv run --locked --extra test --extra decisions --extra workspace
          python ../scripts/build_python_license_evidence.py
          --source-commit "$SOURCE_COMMIT"
          --release-version "$RELEASE_VERSION"
          --target-os "$TARGET_OS"
          --python-version "$PYTHON_VERSION"
          --extra test --extra decisions --extra workspace
          --source-date-epoch "$SOURCE_DATE_EPOCH"
          --output "$LICENSE_EVIDENCE_PATH"

      - name: Attest Python license evidence provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: python/dist/threadforge_${{ steps.release.outputs.version }}_python_${{ matrix.target_os }}_py${{ matrix.python }}.license-evidence.tar.gz

      - name: Upload Python license evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadforge-python-license-evidence-${{ steps.release.outputs.version }}-${{ matrix.target_os }}-py${{ matrix.python }}
          path: python/dist/threadforge_${{ steps.release.outputs.version }}_python_${{ matrix.target_os }}_py${{ matrix.python }}.license-evidence.tar.gz
          if-no-files-found: error
          retention-days: 14

  release-candidate:
    name: Build and attest release candidates (${{ matrix.goos }}/${{ matrix.goarch }})
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
      || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [test, elasticsearch-local-stack, python-license-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python for normalized Windows ZIP packaging
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate release tag and source commit
        id: release
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release candidate tags must be stable vMAJOR.MINOR.PATCH tags." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            if [[ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "The tag does not resolve to the workflow source commit." >&2
              exit 1
            fi
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" == main ]]; then
            version="$RELEASE_VERSION_INPUT"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Manual release rehearsals require a stable MAJOR.MINOR.PATCH version." >&2
              exit 1
            fi
          else
            echo "Release candidates require a stable tag or a manual dispatch from main." >&2
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release source must be reachable from origin/main." >&2
            exit 1
          fi
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"

      - name: Install pinned Go license evidence scanner
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/threadforge-tools
        run: |
          mkdir -p "$GOBIN"
          go install github.com/google/go-licenses/v2@v2.0.1

      - name: Collect target-specific Go license evidence
        shell: bash
        env:
          GO_LICENSES: ${{ runner.temp }}/threadforge-tools/go-licenses
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          LICENSE_EVIDENCE_PATH: dist/threadforge_${{ steps.release.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.go-licenses.tar.gz
        run: >-
          mkdir -p dist &&
          python3 scripts/build_go_license_evidence.py
          --go-licenses "$GO_LICENSES"
          --go "$(command -v go)"
          --goos "$TARGET_OS"
          --goarch "$TARGET_ARCH"
          --source-commit "$GITHUB_SHA"
          --source-date-epoch "$SOURCE_DATE_EPOCH"
          --output "$LICENSE_EVIDENCE_PATH"

      - name: Build normalized CLI archive with legal payload
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TARGET_OS: ${{ matrix.goos }}
          TARGET_ARCH: ${{ matrix.goarch }}
          LICENSE_EVIDENCE_PATH: dist/threadforge_${{ steps.release.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.go-licenses.tar.gz
        run: bash scripts/build-release-artifact.sh "$RELEASE_VERSION" "$TARGET_OS" "$TARGET_ARCH" dist "$LICENSE_EVIDENCE_PATH"

      - name: Generate SPDX SBOM from the built CLI
        id: sbom_first_attempt
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.package.outputs.binary_path }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom_path }}
          syft-version: v1.56.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Retry SPDX SBOM generation once after an installer or network error
        if: steps.sbom_first_attempt.outcome == 'failure'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.package.outputs.binary_path }}
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom_path }}
          syft-version: v1.56.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Reconcile SPDX packages with embedded Go build metadata
        shell: bash
        env:
          BINARY_PATH: ${{ steps.package.outputs.binary_path }}
          SBOM_PATH: ${{ steps.package.outputs.sbom_path }}
        run: >-
          python3 scripts/verify_release_sbom.py
          --binary "$BINARY_PATH"
          --sbom "$SBOM_PATH"
          --main-module github.com/threadforge-ai/threadforge

      - name: Attest archive build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive_path }}

      - name: Attest archive to its SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive_path }}
          sbom-path: ${{ steps.package.outputs.sbom_path }}

      - name: Attest SPDX SBOM file provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.sbom_path }}

      - name: Attest Go license evidence provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/threadforge_${{ steps.release.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.go-licenses.tar.gz

      - name: Upload architecture-specific candidate files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadforge-release-${{ steps.release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.sbom_path }}
            dist/threadforge_${{ steps.release.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.go-licenses.tar.gz
          if-no-files-found: error
          retention-days: 14

  release-candidate-bundle:
    name: Assemble, checksum, and attest release-candidate bundle
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
      || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    needs: [release-candidate, python-license-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate candidate version
        id: release
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$RELEASE_VERSION_INPUT"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release candidate version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download architecture-specific candidate files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: threadforge-release-${{ steps.release.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Download Python license evidence files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: threadforge-python-license-evidence-${{ steps.release.outputs.version }}-*
          merge-multiple: true
          path: dist

      - name: Validate candidate set and create checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          shopt -s nullglob
          archives=(
            "dist/threadforge_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_darwin_amd64.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_darwin_arm64.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_windows_amd64.zip"
          )
          sboms=(dist/threadforge_${RELEASE_VERSION}_*.spdx.json)
          license_evidence=(
            "dist/threadforge_${RELEASE_VERSION}_linux_amd64.go-licenses.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_darwin_amd64.go-licenses.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_darwin_arm64.go-licenses.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_windows_amd64.go-licenses.tar.gz"
          )
          python_license_evidence=(
            "dist/threadforge_${RELEASE_VERSION}_python_linux_py3.11.license-evidence.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_python_linux_py3.12.license-evidence.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_python_windows_py3.11.license-evidence.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_python_windows_py3.12.license-evidence.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_python_darwin_py3.11.license-evidence.tar.gz"
            "dist/threadforge_${RELEASE_VERSION}_python_darwin_py3.12.license-evidence.tar.gz"
          )
          for archive in "${archives[@]}"; do
            if [[ ! -f "$archive" ]]; then
              echo "Missing supported CLI archive: $archive" >&2
              exit 1
            fi
          done
          for evidence in "${license_evidence[@]}"; do
            if [[ ! -f "$evidence" ]]; then
              echo "Missing target Go license-evidence bundle: $evidence" >&2
              exit 1
            fi
          done
          for evidence in "${python_license_evidence[@]}"; do
            if [[ ! -f "$evidence" ]]; then
              echo "Missing target Python license-evidence bundle: $evidence" >&2
              exit 1
            fi
          done
          if [[ ${#sboms[@]} -ne 4 ]]; then
            echo "Expected four SPDX SBOMs." >&2
            find dist -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi
          candidate_payloads=(dist/threadforge_${RELEASE_VERSION}_*)
          if [[ ${#candidate_payloads[@]} -ne 18 ]]; then
            echo "Expected exactly 18 versioned candidate payload files, found ${#candidate_payloads[@]}." >&2
            find dist -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi
          (
            cd dist
            {
              for file in "threadforge_${RELEASE_VERSION}_"*.tar.gz "threadforge_${RELEASE_VERSION}_"*.zip "threadforge_${RELEASE_VERSION}_"*.spdx.json; do
                [[ -f "$file" ]] || continue
                sha256sum "$file"
              done
            } > checksums.txt
            sha256sum --check checksums.txt
          )

      - name: Attest combined checksum file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Upload complete release-candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threadforge-release-candidate-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
