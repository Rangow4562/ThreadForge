  <text x="56" y="112" fill="#00d2ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="13" letter-spacing="1">1. HARNESSES &amp; ADAPTERS (TS)</text>

  <g transform="translate(54, 130)">
