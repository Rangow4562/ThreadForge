    <text x="16" y="107" fill="#9ba3c7" font-family="-apple-system, sans-serif" font-size="12">• Staged local-pending-review migration snapshots &amp; rollback</text>
    <text x="16" y="127" fill="#9ba3c7" font-family="-apple-system, sans-serif" font-size="12">• All-or-nothing cutover assessor verifying evaluator-signed evidence</text>
    <text x="16" y="152" fill="#fbbf24" font-family="monospace" font-size="11">threadforge security scan · endpoint &lt;dest&gt; · migrate · cutover assess</text>
    <text x="16" y="170" fill="#ff7875" font-family="monospace" font-size="10.5">Advisory &amp; read-only by default — never executes commands on hosts</text>
  </g>

