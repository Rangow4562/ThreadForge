  <!-- Column 2: Go Core Runtime & Service -->
  <rect x="348" y="80" width="494" height="624" rx="10" fill="#101320" stroke="#276ef1" stroke-width="2"/>
  <text x="370" y="112" fill="#276ef1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="800" font-size="13" letter-spacing="1">2. THREADFORGE GO CORE &amp; LOOPBACK SERVICE</text>

